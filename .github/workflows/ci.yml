name: CI - Pre-merge Check

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Asegúrate de que coincida con tu versión de Netlify
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for linting errors
        run: npm run lint || echo "No lint script found or linting failed"

      - name: Build project
        run: npm run build
        env:
          # Aquí puedes poner variables dummy si el build las requiere
          JWT_SECRET: "dummy_secret_for_ci"
          MONGODB_URI: "mongodb://localhost:27017/test"
          PORT: 3000

      - name: Success message
        run: echo "Build successful. Ready for merge."
